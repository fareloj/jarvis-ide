name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# O app e' Windows-first: o launcher e' .bat, o terminal mediado usa
# powershell.exe e o armazenamento de segredos depende do DPAPI via
# Electron safeStorage. Validar em windows-latest e' o que reflete a
# realidade de execucao.
jobs:
  validate:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # npm ci falha se package-lock.json divergir do package.json, o que
      # transforma dependencia dessincronizada em erro de build.
      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      # A suite nao pode depender de Ollama, Docker ou chave de API: o
      # runner nao tem nenhum deles, entao qualquer teste que precise de
      # servico externo falha aqui e bloqueia o merge.
      - name: Unit tests
        run: npm test
